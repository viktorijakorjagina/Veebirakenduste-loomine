<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/addPost.css">
    <title>addPost</title>
</head>

<body>
    <header class="site-header">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
            </ul>
        </nav>
        <a class="avatar" href="login.html">
            <img src="images/catProf.jpg" alt="Profile picture">
        </a>
    </header>

    <main>
        <form class="post-container" action="index.html" method="post">
            <label for="post-body">Post body</label>
            <textarea id="post-body" name="post-body" placeholder="textarea"></textarea>

            <label for="file-selector">Select file</label>
            <input type="file" id="file-selector" name="Choose file">

            <input class="create-post-button" type="submit" value="Create post">
        </form>
    </main>

</body>

</html>
